name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Install & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Verify imports
        run: |
          python -c "
          from src.rag.loaders.youtube_loader import YtLoader
          from src.rag.loaders.llm_loader import LLMLoader
          from src.rag.models.claude_model import ClaudeModel
          from src.rag.processing.chunker import TranscriptChunker
          from src.rag.processing.embedder import Embedder
          from src.rag.retrieval.retriever import Retriever
          print('All imports OK')
          "

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing