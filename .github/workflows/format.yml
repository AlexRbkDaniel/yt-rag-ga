name: Format

on:
  pull_request:
    branches: [develop, main]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Check formatting
        run: ruff format --check src tests