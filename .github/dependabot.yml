version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns:
          - "langchain*"
      anthropic:
        patterns:
          - "anthropic"
          - "langchain-anthropic"
      voyage:
        patterns:
          - "langchain-voyageai"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    target-branch: develop